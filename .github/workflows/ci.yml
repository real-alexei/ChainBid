name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Migrations are the source of truth for the schema; the Kysely types are
  # introspected from them. This job re-derives the types from a fresh database
  # and fails if the committed file differs, which is what catches a migration
  # that landed without its regenerated types.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chainbid
          POSTGRES_PASSWORD: chainbid
          POSTGRES_DB: chainbid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chainbid -d chainbid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chainbid:chainbid@localhost:5432/chainbid
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @chainbid/db db:sync

      - name: Fail if the generated types drifted from the migrations
        run: git diff --exit-code -- packages/db/src/schema.ts

  # Boots the whole stack — compose infra, a hardhat node, the three services —
  # and drives a real auction through it: mint, three bids, auto-settlement,
  # asserted over REST, GraphQL, and a captured WS stream (e2e/run.mts).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example .env

      - run: docker compose up -d --wait

      - run: pnpm -r build

      - name: Start hardhat node and deploy contracts
        run: |
          (cd contracts && nohup pnpm exec hardhat node > /tmp/hardhat.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8545 && break; sleep 1; done
          printf 'y\n' | pnpm --filter @chainbid/contracts exec hardhat ignition deploy ignition/modules/ChainBid.ts --network localhost

      - name: Migrate database
        run: |
          set -a && source .env && set +a
          pnpm --filter @chainbid/db migrate

      - name: Start api, indexer, and worker
        run: |
          (cd apps/indexer && nohup node dist/main.js > /tmp/indexer.log 2>&1 &)
          (cd apps/worker && nohup node dist/main.js > /tmp/worker.log 2>&1 &)
          (cd apps/api && nohup node dist/main.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health > /dev/null && break; sleep 1; done

      - run: pnpm --filter @chainbid/e2e e2e

      - name: Dump service logs
        if: failure()
        run: tail -n 100 /tmp/hardhat.log /tmp/indexer.log /tmp/worker.log /tmp/api.log
